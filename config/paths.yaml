# CyberTeacher — Local file paths configuration
# This file defines paths to large assets that are NOT stored in git.
# These files are downloaded separately (see scripts/download_assets.py)
# or synced from the maintainer's machine.

# Root directory for all local assets (not in git)
# Can be overridden by CYBERTEACHER_LOCAL_ROOT environment variable
local_root: "./local"

# FAISS vector index for RAG (knowledge base)
# Generated by: python index_project.py
# Or downloaded from GitHub Releases
faiss_index: "{local_root}/faiss_index.bin"
faiss_metadata: "{local_root}/chunks_metadata.json"

# CVE database (2000+ JSON files)
# Downloaded from NVD or synced from maintainer
cves_dir: "{local_root}/cves"

# Backup directory for state snapshots
# Auto-managed by state.py maybe_auto_backup()
backups_dir: "{local_root}/backups"

# Docker lab configurations (lightweight YAML, not heavy images)
lab_configs_dir: "./lab_configs"

# Knowledge base documents for indexing
# PDFs, markdown files, documentation
knowledge_base_dir: "./knowledge_base"

# Logs directory
logs_dir: "{local_root}/logs"

# Static assets for PWA (cached)
static_cache_dir: "{local_root}/static_cache"

# Temporary files
tmp_dir: "{local_root}/tmp"

# Environment-specific overrides:
# Set CYBERTEACHER_LOCAL_ROOT=/custom/path to override local_root
# Set CYBERTEACHER_FAISS_INDEX=/custom/path to override faiss_index
# etc.