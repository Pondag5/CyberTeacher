[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "config/paths.yaml",
    "stubs/",
    ".git/",
    "__pycache__/",
    ".venv/",
    "venv/",
    "env/",
    "local/",
    "backups/",
    "dist/",
]

[tool.ruff.lint]
    select = ["E", "F", "W", "I", "N", "UP", "YTT", "BLE", "A", "B", "C4", "DTZ", "T20", "SIM", "ARG", "PL", "RUF"]
    ignore = [
        "E501",  # line too long (handled by black)
        "E402",  # module level import not at top
        "F401",  # unused imports (maybe keep for future)
        "T201",  # print found (acceptable in CLI)
        "RUF001", "RUF002", "RUF003",  # ambiguous unicode chars (Cyrillic allowed in strings)
        "BLE001",  # blind exception (sometimes okay)
        "PLC0415",  # import not at top-level (sometimes needed)
        "PLR2004",  # magic values (okay for small scripts)
        "PLR0911", "PLR0912", "PLR0915",  # too many returns/branches/statements
        "UP015",   # unnecessary mode argument (okay for clarity)
        "F541",    # f-string without placeholders (okay)
        "SIM108",  # use ternary (keep as is for readability)
        "F811",    # redefinition (sometimes intended)
        "F841",    # unused variable (okay for debugging)
        "ARG001",  # unused argument (okay for callbacks)
        "B007",    # loop var not used (okay)
        "UP035",   # deprecated typing imports (pre-existing, safe)
        "RUF059",  # unused unpacked variable (pre-existing)
        "SIM117",  # nested with statements (pre-existing)
        "DTZ005",  # datetime.now without tz (pre-existing)
        "DTZ006",  # datetime.fromtimestamp without tz (pre-existing)
        "DTZ007",  # datetime.strptime without %z (pre-existing)
        "DTZ011",  # datetime.date.today (pre-existing)
        "RUF013",  # implicit Optional (pre-existing)
        "W293",    # blank line whitespace (pre-existing)
        "PLW0603", # global statement (pre-existing)
        "PLW0602", # global variable usage (pre-existing)
        "RUF015",  # prefer next(iter()) (pre-existing)
        "PLR1714", # consider merging comparisons (pre-existing)
        "E701",    # multiple statements on one line (pre-existing style)
        # Pre-existing mass violations
        "I001",   # import block unsorted
        "UP006",  # use dict/list instead of Dict/List
        "UP045",  # use X | None instead of Optional[X]
        "B904",   # raise ... from err
        "RUF012", # mutable default
        "N814",   # camelcase import alias
        "SIM105", # use contextlib.suppress
        "B006",   # mutable default argument
        "RUF005", # list concatenation
        "UP024",  # aliased OSError/IOError
        "UP041",  # use builtin TimeoutError
        "B025",   # duplicate exception
        "E401",   # multiple imports on one line
        # Additional pre-existing violations
        "PLR5501",  # use elif instead of else then if
        "SIM116",   # use dictionary instead of consecutive if
        "UP017",    # use datetime.UTC alias
        "SIM300",   # Yoda condition
        "PLR1730",  # replace if with max call
        "PLR0913",  # too many arguments
        "W292",     # no newline at end of file
        "ARG002",   # unused method argument
        "PLW1510",  # subprocess.run without explicit check
        "E741",     # ambiguous variable name
        "W605",     # invalid escape sequence
        "N806",     # variable in function should be lowercase
        "UP007",    # use X | Y for type annotations
        "SIM103",   # return condition directly
        "RUF019",   # unnecessary key check
        "SIM102",   # combine nested if statements
        "SIM114",   # combine if branches with or
        "SIM115",   # use context manager for opening files
        "SIM118",   # use key in dict instead of dict.keys()
        "UP028",    # replace yield for with yield from
        "N802",     # function name should be lowercase
        "N803",     # argument name should be lowercase
        "A001",     # variable shadowing builtin
        "E713",     # test for membership should be not in
        "E722",     # bare except
        "E731",     # do not assign lambda
        "RUF010",   # explicit conversion flag
        "B010",     # unnecessary self argument
        "B023",     # function definition does not bind loop variable
        "B905",     # zip without strict
        "PLW0108",  # lambda may be unnecessary
        "PLW2901",  # for loop variable overwritten
        "ARG005",   # unused lambda argument
    ]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "ARG", "D"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "stubs"
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# Ignore pre-existing type violations (mass legacy debt)
ignore_error_codes = [
    "return-value",      # Incompatible return value type (HandlerResult tuples)
    "attr-defined",      # AppState missing attributes
    "no-any-return",     # Returning Any from typed function
    "arg-type",          # Argument type mismatches
    "operator",          # Unsupported operand types
    "var-annotated",     # Need type annotation for variable
    "unused-ignore",     # Unused type: ignore comments
    "call-arg",          # Unexpected keyword arguments
    "assignment",        # Incompatible default for parameter
    "valid-type",        # Invalid type (Literal[True] etc)
]

# Исключить сторонние папки
exclude = [
    "src/",
    "tests/",
    "book_new/",
    "knowledge_base/",
    "embeddings/",
    "memory/",
    "backups/",
    "migrations/",
    "__pycache__/",
    ".mypy_cache/",
    ".ruff_cache/",
    "venv/",
    "env/",
]

# Для модулей, которые ещё не полностью аннотированы (можно временно ослабить)
[[tool.mypy.overrides]]
module = "handlers.core"
disallow_untyped_defs = false

