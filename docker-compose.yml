version: "3.8"

# CyberTeacher - Docker Compose (M-01)
# Запуск всего стека одной командой: docker-compose up -d

services:
  # Основной сервис CyberTeacher
  cyberteacher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberteacher
    restart: unless-stopped
    volumes:
      # Персистентные данные
      - ./memory:/app/memory
      - ./knowledge_base:/app/knowledge_base
      - ./embeddings:/app/embeddings
      - ./backups:/app/backups
      - ./assignment_templates:/app/assignment_templates
      # Конфигурация
      - ./.env:/app/.env:ro
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8501:8501"  # Streamlit Web UI
    depends_on:
      - ollama
    networks:
      - cyberteacher-net

  # Ollama для локальной LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - cyberteacher-net

  # DVWA - уязвимое веб-приложение для практики
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    networks:
      - cyberteacher-net

  # OWASP Juice Shop
  juice_shop:
    image: bkimminich/juice-shop:latest
    container_name: juice_shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - cyberteacher-net

  # Metasploitable 2 (для сетевых упражнений)
  metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: metasploitable
    restart: unless-stopped
    ports:
      - "2121:21"
      - "2222:22"
      - "8081:80"
      - "4444:4444"
    networks:
      - cyberteacher-net

  # PostgreSQL для расширенной аналитики (опционально)
  postgres:
    image: postgres:15-alpine
    container_name: cyberteacher_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cyberteacher
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cyberteacher_secret}
      - POSTGRES_DB=cyberteacher_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cyberteacher-net
    profiles:
      - analytics  # Запускать только с --profile analytics

volumes:
  ollama_data:
    driver: local
  postgres_data:
    driver: local

networks:
  cyberteacher-net:
    driver: bridge
