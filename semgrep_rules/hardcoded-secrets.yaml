# Hardcoded secrets detection
rules:
  - id: hardcoded-secret
    pattern-either:
      - pattern: $PASSWORD = "..."
      - pattern: $SECRET = "..."
      - pattern: $API_KEY = "..."
      - pattern: $TOKEN = "..."
      - pattern: $PRIVATE_KEY = "..."
      - patterns:
          - pattern: |
              app.config['SECRET_KEY'] = "..."
      - patterns:
          - pattern: |
              app.config['DATABASE_PASSWORD'] = "..."
      - patterns:
          - pattern: |
              settings.SECRET_KEY = "..."
      - patterns:
          - pattern: |
              process.env.SECRET = "..."
      - patterns:
          - pattern: |
              const SECRET_KEY = "..."
      - patterns:
          - pattern: |
              const API_KEY = "..."
    message: "Hardcoded Secret: захардкоженный секрет в коде. Используйте переменные окружения или vault."
    severity: WARNING
    languages:
      - python
      - javascript
      - typescript
    metadata:
      owasp: "A07:2021 – Identification and Authentication Failures"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
      impact: HIGH
