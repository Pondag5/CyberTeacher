{
  "name": "coder-project",
  "version": "1.0.0",
  "schema": "v1",
  "experimental": {
    "agentmode": true
  },
  "models": [
    {
      "name": "autodetect",
      "provider": "lmstudio",
      "model": "autodetect",
      "apiBase": "http://localhost:1234/v1",
      "apiKey": "sk-lm-KN3VuMjH:YovWNHGHWo5hqTjCxBUR",
      "contextLength": 32768,
      "roles": [
        "chat",
        "autocomplete",
        "edit"
      ],
      "defaultCompletionOptions": {
        "temperature": 0.1,
        "maxTokens": 4096
      }
    },
    {
      "name": "Autodetect",
      "provider": "lmstudio",
      "model": "AUTODETECT",
