<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CyberTeacher — AI-наставник по кибербезопасности</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00FFC3">
    <meta name="description" content="AI-наставник по кибербезопасности с интерактивными лабораториями">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Non-critical fonts (async) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Fira+Code:wght@400;500;600&family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code:wght@400&display=swap" rel="stylesheet"></noscript>
    <!-- Non-critical: Font Awesome + Markdown (defer) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></noscript>
</head>
<body>
<div id="scanlines"></div>
<div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <h1 class="glitch-trigger">CyberTeacher</h1>
            <p>AI-наставник по кибербезопасности</p>
        </div>
        <div class="nav" id="navContainer"></div>
        <div id="difficultyBadge"></div>
        <div class="theme-toggle" id="themeToggle"></div>
    </div>

    <!-- Main area -->
    <div class="main">
        <div class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">&#9776; Меню</button>
            </div>
            <div class="header-right">
                <button class="notif-btn" id="notifBtn" title="Уведомления">&#128276;</button>
                <button class="sound-toggle" id="soundToggle">&#128266;</button>
                <div class="user-info" id="userInfo"></div>
            </div>
        </div>
        <div class="content" id="content"></div>
        <div class="status-bar" id="statusBar">
            <span class="status-item"><span class="status-dot green"></span> Online</span>
            <span class="status-item" id="statusLLM">LLM: —</span>
            <span class="status-item" id="statusRisk">Risk: —</span>
            <span class="status-item" id="statusCyber">Cyberpsychosis: —</span>
            <span class="status-item" id="statusXP">XP: 0</span>
            <span class="status-item sound-indicator" id="soundIndicator">
                <span class="wave"></span><span class="wave"></span><span class="wave"></span>
            </span>
            <span class="status-item" style="margin-left:auto;">
                <span id="statusTime"></span>
            </span>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/utils.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/themes.js" defer></script>
<script src="js/sounds.js" defer></script>
<script src="js/heatmap.js" defer></script>
<script src="js/charts.js" defer></script>
<script src="js/particles.js" defer></script>
<script src="js/effects.js" defer></script>
<script src="js/components/cyberpsychosis.js" defer></script>
<script src="js/offline.js" defer></script>
<script src="js/notifications.js" defer></script>
<script src="js/notifications_ws.js" defer></script>
<script src="js/glitch.js" defer></script>
<script src="js/onboarding.js" defer></script>
<script src="js/components/risk_indicators.js" defer></script>
<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</body>
</html>
